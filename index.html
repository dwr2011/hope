<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>刘厚朴模拟器：竞赛进阶版</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game">
    <header>
      <h1>刘厚朴模拟器：竞赛进阶版</h1>
      <p class="subtitle">加入方向训练（DP/数论/图论）、集训、社交与多题部分分比赛（CSP-S/NOIP/NOI）。</p>
    </header>

    <section class="stats" aria-label="角色属性">
      <div><span>周数</span><strong id="week">1</strong></div>
      <div><span>健康</span><strong id="health">100</strong></div>
      <div><span>精力</span><strong id="energy">100</strong></div>
      <div><span>压力</span><strong id="stress">15</strong></div>
      <div><span>DP</span><strong id="dp">15</strong></div>
      <div><span>数论</span><strong id="nt">12</strong></div>
      <div><span>图论</span><strong id="graph">14</strong></div>
      <div><span>文化课</span><strong id="science">35</strong></div>
      <div><span>社交</span><strong id="social">45</strong></div>
      <div><span>家庭支持</span><strong id="family">60</strong></div>
      <div><span>竞赛积分</span><strong id="score">0</strong></div>
      <div><span>下一赛事</span><strong id="exam">第8周 CSP-S</strong></div>
    </section>

    <section class="story">
      <h2 id="event-title">新学期开始</h2>
      <p id="event-text">你是刘厚朴，理科生。你要在训练强度、健康、社交和文化课之间找到平衡。</p>
    </section>

    <section class="actions" aria-label="行动选择">
      <h3>本周行动（每周选 1 项）</h3>
      <div id="action-buttons"></div>
    </section>

    <section class="log-wrap">
      <h3>成长日志</h3>
      <ul id="log"></ul>
    </section>

    <section class="controls">
      <button id="restart">重新开始</button>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3 id="modal-title">事件</h3>
      <p id="modal-text"></p>
      <div id="modal-progress" class="modal-progress"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
