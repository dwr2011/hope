<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>刘厚朴模拟器：信息竞赛成长记</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game">
    <header>
      <h1>刘厚朴模拟器：信息竞赛成长记</h1>
      <p class="subtitle">爸妈都是生物老师，但你要走信息竞赛之路！</p>
    </header>

    <section class="stats" aria-label="角色属性">
      <div><span>周数</span><strong id="week">1</strong></div>
      <div><span>精力</span><strong id="energy">100</strong></div>
      <div><span>算法</span><strong id="algo">20</strong></div>
      <div><span>数理</span><strong id="science">35</strong></div>
      <div><span>生物知识</span><strong id="bio">50</strong></div>
      <div><span>家庭支持</span><strong id="family">60</strong></div>
      <div><span>压力</span><strong id="stress">15</strong></div>
      <div><span>奖牌进度</span><strong id="medal">0</strong></div>
    </section>

    <section class="story">
      <h2 id="event-title">新学期开始</h2>
      <p id="event-text">你叫刘厚朴，高一理科生。爸妈都在学校教生物，常常拿“遗传规律”启发你，但你更想在信息竞赛里发光。</p>
    </section>

    <section class="actions" aria-label="行动选择">
      <h3>本周行动（每周选 1 项）</h3>
      <div id="action-buttons"></div>
    </section>

    <section class="log-wrap">
      <h3>成长日志</h3>
      <ul id="log"></ul>
    </section>

    <section class="controls">
      <button id="restart">重新开始</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
